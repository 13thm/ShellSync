name: shellsync_mobile
description: ShellSync mobile client — 远程查看与操控电脑端终端任务。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.5.0
  web_socket_channel: ^3.0.0
  meta: ^1.11.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.0
  mobile_scanner: ^7.0.0
  xterm: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
